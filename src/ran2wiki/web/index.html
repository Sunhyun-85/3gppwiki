<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RAN2 Wiki</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1118;--panel:#131d28;--line:#283746;--text:#e8f0f6;--muted:#99aaba;--blue:#65b5ff;--green:#6ed6a0;--amber:#ffd078}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}header{padding:20px max(18px,5vw);border-bottom:1px solid var(--line)}h1{margin:0;font-size:23px}header p{margin:6px 0 0;color:var(--muted)}main{max-width:1100px;margin:auto;padding:20px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:16px}.tabs button,.button{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px 14px;border-radius:9px;white-space:nowrap}.tabs button.active,.button:hover{border-color:var(--blue);color:var(--blue)}form{display:grid;grid-template-columns:1fr auto;gap:9px;margin-bottom:16px}.filters{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}input,select{min-width:0;background:#0e1720;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:12px;font:inherit}.filters input,.filters select{padding:8px;max-width:180px}.cards{display:grid;gap:11px}.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:15px}.meta{color:var(--muted);font-size:13px;margin-bottom:7px}.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:2px 7px;margin:0 5px 4px 0;font-size:12px}.AGREEMENT,.CONCLUSION{color:var(--green)}.FFS{color:var(--amber)}a{color:var(--blue)}pre{white-space:pre-wrap;word-break:break-word;font:14px system-ui,sans-serif;margin:7px 0}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.stat{background:var(--panel);border-radius:9px;padding:9px 12px}.empty,.loading{color:var(--muted);padding:25px;text-align:center}@media(max-width:600px){main{padding:13px}form{grid-template-columns:1fr}.button{width:100%}.filters{grid-column:auto}.filters>*{max-width:none!important;flex:1 1 40%}}
  </style>
</head>
<body><header><h1>RAN2 Wiki</h1><p>Rel-20 / 6G local evidence search · LLM/API 없이 동작</p></header>
<main><div id="stats" class="stats"></div><nav class="tabs">
  <button data-view="search" class="active">문서 검색</button><button data-view="agreements">합의 / FFS</button>
  <button data-view="trace">주제 추적</button><button data-view="chair-notes">Chair Notes</button><button data-view="meetings">회의</button><button data-view="tdoc">TDoc 조회</button>
</nav><section id="controls"></section><section id="results" class="cards"></section></main>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const link=(url,label='원문')=>url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`:'';
let view='search';
async function api(path,params={}){const u=new URL('/api/'+path,location.origin);Object.entries(params).forEach(([k,v])=>v&&u.searchParams.set(k,v));const r=await fetch(u);const j=await r.json();if(!r.ok)throw Error(j.error||r.statusText);return j}
function loading(){results.innerHTML='<div class="loading">검색 중…</div>'} function error(e){results.innerHTML=`<div class="card">오류: ${esc(e.message)}</div>`}
function evidence(x){const kind=x.evidence_type||x.outcome_type||x.scope||'';const open=x.tdoc_id?` <button class="button" onclick="showTdoc('${esc(x.tdoc_id)}')">TDoc 열기</button>`:'';return `<article class="card"><div class="meta"><span class="tag ${esc(x.outcome_type)}">${esc(kind)}</span>${esc(x.meeting||'')} · Agenda ${esc(x.agenda||'-')} ${x.tdoc_id?'· <b>'+esc(x.tdoc_id)+'</b>':''}</div><b>${esc(x.title||x.text||'')}</b>${x.company?`<div>${esc(x.company)} ${x.status?'· '+esc(x.status):''}</div>`:''}<pre>${esc(x.relevant_text||(!x.title?x.text:'')||x.discussion||'')}</pre><div class="meta">${esc(x.source_file||'')} ${link(x.source_url)}${open}</div></article>`}
function controls(){const templates={
search:`<form id="form"><input name="q" placeholder="예: dynamic UE capability" required><button class="button">검색</button><div class="filters"><select name="scope"><option>ALL</option><option>REL20</option><option>6G</option></select><input name="meeting" placeholder="회의 (예: 131bis)"><input name="agenda" placeholder="Agenda"><input name="company" placeholder="회사/출처"></div></form>`,
agreements:`<form id="form"><input name="q" placeholder="합의·결론·FFS에서 검색" required><button class="button">검색</button><div class="filters"><select name="type"><option>ALL</option><option>AGREEMENT</option><option>CONCLUSION</option><option>FFS</option></select></div></form>`,
trace:`<form id="form"><input name="q" placeholder="회의별로 추적할 주제" required><button class="button">시간순 추적</button></form>`,
"chair-notes":`<form id="form"><input name="meeting" placeholder="회의 (예: 131bis)" required><button class="button">Chair Notes 보기</button><div class="filters"><input name="agenda" placeholder="Agenda (선택)"></div></form>`,
tdoc:`<form id="form"><input name="id" placeholder="R2-2501234" required><button class="button">조회</button></form>`,meetings:''};controlsEl.innerHTML=templates[view];if(view==='meetings')run();else $('#form').onsubmit=e=>{e.preventDefault();run(Object.fromEntries(new FormData(e.target)))}}
async function run(p={}){loading();try{let data=await api(view,p);if(view==='meetings'){results.innerHTML=data.map(m=>`<article class="card"><b>${esc(m.name)}</b><div>${m.tdoc_count} TDocs · ${m.chair_section_count} Chair sections</div><div>${link(m.source_url,'회의 원문')}</div><button class="button" onclick="showMeeting('${esc(m.name)}')">Agenda 보기</button></article>`).join('')||'<div class="empty">회의 없음</div>';return}if(view==='tdoc'){showTdocData(data);return}if(view==='chair-notes'){results.innerHTML=data.map(x=>evidence({...x,evidence_type:'CHAIR_NOTES',relevant_text:[x.discussion,x.outcomes].filter(Boolean).join('\n')})).join('')||'<div class="empty">Chair Notes 결과 없음</div>';return}if(view==='trace'){results.innerHTML=data.map(m=>`<article class="card"><h2>${esc(m.meeting)}</h2>${m.outcomes.map(evidence).join('')}${m.chair_evidence.map(evidence).join('')}${m.tdocs.map(evidence).join('')}</article>`).join('')||'<div class="empty">검색 결과 없음</div>';return}results.innerHTML=data.map(evidence).join('')||'<div class="empty">검색 결과 없음</div>'}catch(e){error(e)}}
function showTdocData(data){results.innerHTML=data?`<article class="card"><div class="meta">${esc(data.meeting)} · Agenda ${esc(data.agenda||'-')} · ${esc(data.classification)}</div><h2>${esc(data.tdoc_id)} — ${esc(data.title)}</h2><div>${esc(data.company||'')} · ${esc(data.status||'')}</div><details><summary>추출된 본문 보기</summary><pre>${esc(data.full_text||'추출된 본문 없음')}</pre></details>${link(data.source_url,'원본 파일')}</article>`:'<div class="empty">TDoc를 찾지 못했습니다.</div>'}
async function showTdoc(id){loading();try{showTdocData(await api('tdoc',{id}))}catch(e){error(e)}}
async function showMeeting(id){loading();try{const m=await api('meeting',{id});results.innerHTML=`<article class="card"><h2>${esc(m.name)}</h2><div>${m.tdoc_count} TDocs · ${link(m.source_url,'회의 원문')}</div>${m.agenda.map(a=>`<p><b>${esc(a.number)}</b> ${esc(a.title||'')}</p>`).join('')}</article>`}catch(e){error(e)}}
const controlsEl=$('#controls'),results=$('#results');document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelector('.active').classList.remove('active');b.classList.add('active');view=b.dataset.view;controls();results.innerHTML=''});
function loadStatus(){api('status').then(s=>{const r=s.sync_run,run=r?`<span class="stat">Update <b>${esc(r.status)}</b> · ${r.downloaded_count} downloaded</span>`:'';$('#stats').innerHTML=`<span class="stat">회의 <b>${s.meetings}</b></span><span class="stat">TDocs <b>${s.tdocs}</b></span><span class="stat">Rel-20 <b>${s.rel20_tdocs}</b></span><span class="stat">6G <b>${s.six_g_tdocs}</b></span><span class="stat">Chair sections <b>${s.chair_sections}</b></span>${run}`}).catch(()=>{})}loadStatus();setInterval(loadStatus,30000);controls();
</script></body></html>
